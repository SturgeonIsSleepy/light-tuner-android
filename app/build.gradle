plugins { id 'com.android.application' }
android {
    namespace 'io.github.sturgeonissleepy.lighttuner'
    compileSdk 36
    defaultConfig {
        applicationId 'io.github.sturgeonissleepy.lighttuner'
        minSdk 31
        targetSdk 36
        versionCode 10
        versionName '0.7.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
